services:
  server:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./server:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install --omit=dev && node index.js"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: nginx:alpine
    user: "0:0"
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.base44.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
